[package]
name = "alfa-selector-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WASM bindings around Servo's `selectors` crate for Alfa's cascade engine (Milestone 1 PoC)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
selectors = "0.28"
cssparser = "0.35"
servo_arc = "0.4"
precomputed-hash = "0.1"
smallvec = "1"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = "s"
lto = true
